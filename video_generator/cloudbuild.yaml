steps:
  # Step 1: Ensure Cloud Text-to-Speech API is enabled in the project
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: "enable-tts-api"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud services enable texttospeech.googleapis.com --project=$PROJECT_ID

  # Step 2: Synthesize Google Cloud TTS narration, record 1080p Playwright UI walkthrough, and master MP4
  - name: "mcr.microsoft.com/playwright/python:v1.50.0-noble"
    id: "generate-5min-demo-video"
    entrypoint: "bash"
    env:
      - "PROJECT_ID=$PROJECT_ID"
      - "COCKPIT_URL=https://acme-abo-cockpit-101296135052.us-central1.run.app"
      - "OUTPUT_DIR=/workspace/video_output"
    args:
      - "-c"
      - |
        set -e
        apt-get update && apt-get install -y --no-install-recommends ffmpeg
        pip install --no-cache-dir playwright==1.50.0 google-auth requests
        python3 generate_demo_video.py
        ls -lh /workspace/video_output/alc_executive_5min_demo.mp4

  # Step 3: Upload finished 1080p MP4 to Google Cloud Storage
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: "upload-to-gcs"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud storage cp /workspace/video_output/alc_executive_5min_demo.mp4 gs://${PROJECT_ID}_cloudbuild/videos/alc_executive_5min_demo.mp4
        echo "Uploaded to gs://${PROJECT_ID}_cloudbuild/videos/alc_executive_5min_demo.mp4"

timeout: "1800s"
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"

